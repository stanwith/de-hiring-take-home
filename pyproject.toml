[project]
name = "wikipedia-etl"
version = "0.1.0"
description = "ETL pipeline — Wikipedia Toronto link graph to depth 2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "lxml>=5.2.0",
]

[project.scripts]
wikipedia-etl = "wikipedia_etl.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikipedia_etl"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
